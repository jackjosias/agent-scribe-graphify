name: Temporary stabilized ChatGPT transcript export 6a8b4655

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check curl-cffi beautifulsoup4

      - name: Recover validated extractor from repository history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = (
              'https://api.github.com/repos/jackjosias/agent-scribe-graphify/contents/'
              'tmp_chat_export_6a61d60a/export_stabilized.py'
              '?ref=0bd945a9c6040c867224faa8307c2d19adb7a760'
          )
          req = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'chat-export-workflow',
              },
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              payload = json.load(response)
          content = base64.b64decode(payload['content'])
          Path('/tmp/export_stabilized.py').write_bytes(content)
          print('extractor_bytes=', len(content))
          PY

      - name: Extract and stabilize complete visible conversation
        env:
          SHARE_URL: https://chatgpt.com/share/6a8b4655-decc-83ea-a689-8183a6d044e6
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp_chat_export_6a61d60a/result
          python /tmp/export_stabilized.py 2>&1 | tee tmp_chat_export_6a61d60a/result/run.log

      - name: Verify integrity and proven end
        shell: bash
        run: |
          set -euo pipefail
          DIR="tmp_chat_export_6a61d60a/result"
          DIAG="$DIR/diagnostics.txt"
          CMP="$DIR/double-fetch-comparison.txt"
          TXT="$DIR/conversation-chatgpt-public-6a8b4655-decc-83ea-a689-8183a6d044e6-INTEGRALE.txt"
          test -s "$DIAG"
          test -s "$CMP"
          test -s "$TXT"
          grep -q '^share_url=https://chatgpt.com/share/6a8b4655-decc-83ea-a689-8183a6d044e6$' "$DIAG"
          grep -q '^double_fetch_stabilization=PASS$' "$DIAG"
          grep -q '^real_end_verified=YES$' "$DIAG"
          grep -q '^integral_export_validated=YES$' "$DIAG"
          grep -q '^DOUBLE_FETCH_STABILIZATION=PASS$' "$CMP"
          grep -q '^FIN_REELLE_DU_PARTAGE_VERIFIEE=OUI$' "$CMP"
          python - <<'PY'
          from pathlib import Path
          import re
          diag = Path('tmp_chat_export_6a61d60a/result/diagnostics.txt').read_text(encoding='utf-8')
          for name in ('visible_entries', 'visible_user_messages', 'visible_assistant_messages'):
              match = re.search(rf'^{name}=(\d+)$', diag, re.M)
              if not match or int(match.group(1)) < 1:
                  raise SystemExit(f'Extraction incomplete: {name}')
          print(diag)
          PY

      - name: Upload transcript and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-public-6a8b4655-integrale
          path: tmp_chat_export_6a61d60a/result/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
