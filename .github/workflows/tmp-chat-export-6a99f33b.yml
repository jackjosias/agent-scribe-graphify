name: Temporary stabilized ChatGPT transcript export 6a99f33b

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check curl-cffi

      - name: Extract and stabilize complete visible conversation
        env:
          SHARE_URL: https://chatgpt.com/share/6a99f33b-6bf8-83ea-80e3-ba4a0b6ce712
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp_chat_export_6a61d60a/result
          cat > /tmp/export_backend_share.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          from curl_cffi import requests

          SHARE_URL = os.environ['SHARE_URL']
          SHARE_ID = SHARE_URL.rstrip('/').rsplit('/', 1)[-1]
          API_URL = f'https://chatgpt.com/backend-api/share/{SHARE_ID}'
          OUT = Path.cwd() / 'tmp_chat_export_6a61d60a' / 'result'
          OUT.mkdir(parents=True, exist_ok=True)
          TXT = OUT / f'conversation-chatgpt-public-{SHARE_ID}-INTEGRALE.txt'
          DIAG = OUT / 'diagnostics.txt'
          CMP = OUT / 'double-fetch-comparison.txt'
          PREVIEW = OUT / 'first-last-preview.txt'

          class ExportFailure(RuntimeError):
              pass

          def norm(text: str) -> str:
              return text.replace('\r\n', '\n').replace('\r', '\n').replace('\xa0', ' ').strip()

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def fetch_api(label: str) -> tuple[bytes, dict[str, Any]]:
              session = requests.Session(impersonate='chrome124')
              headers = {
                  'Accept': 'application/json',
                  'Accept-Language': 'fr-FR,fr;q=0.9,en;q=0.7',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
                  'Referer': SHARE_URL,
              }
              notes = []
              for attempt in range(1, 7):
                  try:
                      response = session.get(
                          API_URL,
                          headers=headers,
                          timeout=180,
                          params={'_archive_probe': f'{label}-{time.time_ns()}'},
                      )
                      notes.append(
                          f'{label}: attempt={attempt} status={response.status_code} '
                          f'type={response.headers.get("content-type")} bytes={len(response.content)}'
                      )
                      if response.status_code == 200 and len(response.content) > 1000:
                          payload = response.json()
                          if isinstance(payload, dict) and isinstance(payload.get('linear_conversation'), list):
                              raw = response.content
                              (OUT / f'backend-share-{label}.json').write_bytes(raw)
                              (OUT / f'fetch-{label}.txt').write_text('\n'.join(notes) + '\n', encoding='utf-8')
                              return raw, payload
                          notes.append(f'{label}: JSON sans linear_conversation')
                      else:
                          body = response.text[:1000].replace('\n', ' ')
                          notes.append(f'{label}: body={body}')
                  except Exception as exc:
                      notes.append(f'{label}: attempt={attempt} {type(exc).__name__}: {exc}')
                  time.sleep(attempt * 2)
              (OUT / f'fetch-{label}.txt').write_text('\n'.join(notes) + '\n', encoding='utf-8')
              raise ExportFailure('Backend share inaccessible:\n' + '\n'.join(notes))

          def ordered_unique(values: list[str]) -> list[str]:
              out, seen = [], set()
              for value in values:
                  value = norm(value)
                  if value and value not in seen:
                      seen.add(value)
                      out.append(value)
              return out

          def attachment_block(value: dict[str, Any]) -> str:
              lines = ['[PIÈCE JOINTE OU CONTENU MULTIMÉDIA]']
              for field in ('name','filename','file_name','title','mime_type','content_type','size','size_bytes','width','height','url'):
                  item = value.get(field)
                  if isinstance(item, (str, int, float)) and str(item).strip():
                      lines.append(f'{field}: {item}')
              if len(lines) == 1:
                  lines.append(f'type: {value.get("content_type") or value.get("type") or "élément joint"}')
              return '\n'.join(lines)

          def visible_chunks(value: Any, attachment_context: bool = False) -> list[str]:
              if isinstance(value, str):
                  return [value] if value.strip() else []
              if value is None or isinstance(value, (int, float, bool)):
                  return []
              if isinstance(value, list):
                  chunks: list[str] = []
                  for item in value:
                      chunks.extend(visible_chunks(item, attachment_context))
                  return ordered_unique(chunks)
              if not isinstance(value, dict):
                  return []
              chunks: list[str] = []
              content_type = str(value.get('content_type') or value.get('type') or '').lower()
              is_attachment = attachment_context or any(
                  token in content_type for token in ('asset_pointer','attachment','file','image','audio','video')
              )
              for key in ('text','content','caption','transcript','result','output'):
                  field = value.get(key)
                  if isinstance(field, str) and field.strip():
                      chunks.append(field)
                  elif isinstance(field, (dict, list)):
                      chunks.extend(visible_chunks(field, is_attachment))
              if is_attachment:
                  chunks.append(attachment_block(value))
              for key in ('parts','items','attachments','files','children','data','references','citations'):
                  field = value.get(key)
                  if isinstance(field, (dict, list)):
                      chunks.extend(visible_chunks(field, is_attachment))
              for key in ('name','filename','file_name','title','label','url'):
                  field = value.get(key)
                  if isinstance(field, str) and field.strip():
                      if key == 'url' or not is_attachment:
                          chunks.append(field)
              return ordered_unique(chunks)

          def message_text(message: dict[str, Any]) -> str:
              chunks = visible_chunks(message.get('content'))
              metadata = message.get('metadata')
              if isinstance(metadata, dict):
                  for key in ('attachments','files','citations'):
                      field = metadata.get(key)
                      if isinstance(field, (dict, list)):
                          chunks.extend(visible_chunks(field, True))
              return norm('\n\n'.join(ordered_unique(chunks)))

          def hidden(message: dict[str, Any]) -> bool:
              metadata = message.get('metadata')
              return isinstance(metadata, dict) and metadata.get('is_visually_hidden_from_conversation') is True

          def assistant_visible(message: dict[str, Any], text: str) -> bool:
              if hidden(message):
                  return False
              if message.get('recipient') not in (None, '', 'all'):
                  return False
              if message.get('channel') not in (None, '', 'final', 'commentary'):
                  return False
              if message.get('status') not in (None, '', 'finished', 'finished_successfully'):
                  return False
              return text.strip() != 'The output of this plugin was redacted.'

          def iso_ts(value: Any) -> str | None:
              if not isinstance(value, (int, float)) or not math.isfinite(float(value)):
                  return None
              try:
                  return datetime.fromtimestamp(float(value), tz=timezone.utc).isoformat(timespec='seconds')
              except Exception:
                  return None

          def snapshot(raw: bytes, payload: dict[str, Any]) -> dict[str, Any]:
              linear = payload.get('linear_conversation') or []
              entries = []
              seen = set()
              raw_role_counts: dict[str, int] = {}
              excluded_hidden = 0
              excluded_internal = 0
              for i, item in enumerate(linear):
                  if not isinstance(item, dict):
                      continue
                  message = item.get('message') if isinstance(item.get('message'), dict) else item
                  if not isinstance(message, dict):
                      continue
                  author = message.get('author')
                  role = author.get('role') if isinstance(author, dict) else message.get('role')
                  role = str(role or '')
                  raw_role_counts[role] = raw_role_counts.get(role, 0) + 1
                  if role not in {'user','assistant'}:
                      continue
                  if hidden(message):
                      excluded_hidden += 1
                      continue
                  text = message_text(message)
                  if not text:
                      continue
                  if role == 'assistant' and not assistant_visible(message, text):
                      excluded_internal += 1
                      continue
                  mid = str(message.get('id') or item.get('id') or f'linear-{i}')
                  if mid in seen:
                      continue
                  seen.add(mid)
                  channel = str(message.get('channel') or '')
                  metadata = message.get('metadata') if isinstance(message.get('metadata'), dict) else {}
                  entries.append({
                      'id': mid,
                      'role': role,
                      'subtype': 'progression' if role == 'assistant' and channel == 'commentary' else 'message',
                      'text': text,
                      'timestamp': iso_ts(message.get('create_time')),
                      'model': metadata.get('model_slug') or metadata.get('resolved_model_slug'),
                  })
              if not entries:
                  raise ExportFailure('Aucun message visible user/assistant dans linear_conversation.')
              semantic = json.dumps(
                  [{'id':e['id'],'role':e['role'],'subtype':e['subtype'],'text':e['text']} for e in entries],
                  ensure_ascii=False, separators=(',', ':'), sort_keys=True,
              ).encode('utf-8')
              return {
                  'raw_sha': sha(raw),
                  'raw_bytes': len(raw),
                  'payload': payload,
                  'title': norm(str(payload.get('title') or 'Conversation ChatGPT publique')),
                  'linear_count': len(linear),
                  'entries': entries,
                  'semantic_sha': sha(semantic),
                  'raw_role_counts': raw_role_counts,
                  'excluded_hidden': excluded_hidden,
                  'excluded_internal': excluded_internal,
              }

          def render(s: dict[str, Any]) -> str:
              entries = s['entries']
              users = sum(e['role']=='user' for e in entries)
              assistants = sum(e['role']=='assistant' for e in entries)
              progress = sum(e['subtype']=='progression' for e in entries)
              lines = [
                  'CONVERSATION CHATGPT PUBLIQUE — EXTRACTION INTÉGRALE VISIBLE',
                  f'Titre : {s["title"]}',
                  f'URL : {SHARE_URL}',
                  f'Messages visibles : {len(entries)}',
                  f'Utilisateur : {users}',
                  f'Assistant : {assistants}',
                  f'Mises à jour assistant visibles : {progress}',
                  '',
                  '='*80,
                  '',
              ]
              for n, e in enumerate(entries, 1):
                  label = 'UTILISATEUR' if e['role']=='user' else ('ASSISTANT — MISE À JOUR' if e['subtype']=='progression' else 'ASSISTANT')
                  lines.extend([
                      f'MESSAGE {n:04d} — {label}',
                      f'id: {e["id"]}',
                  ])
                  if e.get('timestamp'):
                      lines.append(f'timestamp_utc: {e["timestamp"]}')
                  if e.get('model'):
                      lines.append(f'model: {e["model"]}')
                  lines.extend(['', e['text'], '', '-'*80, ''])
              return '\n'.join(lines).rstrip() + '\n'

          raw_a, payload_a = fetch_api('A')
          time.sleep(2)
          raw_b, payload_b = fetch_api('B')
          a = snapshot(raw_a, payload_a)
          b = snapshot(raw_b, payload_b)

          def signature(s: dict[str, Any]):
              return [(e['id'], e['role'], e['subtype'], e['text']) for e in s['entries']]

          same_sequence = signature(a) == signature(b)
          same_title = a['title'] == b['title']
          same_semantic = a['semantic_sha'] == b['semantic_sha']
          first_same = signature(a)[0] == signature(b)[0]
          last_same = signature(a)[-1] == signature(b)[-1]
          if not all((same_sequence, same_title, same_semantic, first_same, last_same)):
              raise ExportFailure('Double récupération divergente; export refusé.')

          transcript = render(a)
          TXT.write_text(transcript, encoding='utf-8')
          transcript_bytes = transcript.encode('utf-8')
          entries = a['entries']
          users = sum(e['role']=='user' for e in entries)
          assistants = sum(e['role']=='assistant' for e in entries)
          progress = sum(e['subtype']=='progression' for e in entries)
          attachment_markers = transcript.count('[PIÈCE JOINTE OU CONTENU MULTIMÉDIA]')
          current_node = a['payload'].get('current_node_id') or a['payload'].get('current_node')

          diag_lines = [
              f'share_url={SHARE_URL}',
              f'share_id={SHARE_ID}',
              f'title={a["title"]}',
              f'fetch_a_json_bytes={a["raw_bytes"]}',
              f'fetch_a_json_sha256={a["raw_sha"]}',
              f'fetch_b_json_bytes={b["raw_bytes"]}',
              f'fetch_b_json_sha256={b["raw_sha"]}',
              f'linear_entries={a["linear_count"]}',
              f'raw_role_counts={a["raw_role_counts"]}',
              f'visible_entries={len(entries)}',
              f'visible_user_messages={users}',
              f'visible_assistant_messages={assistants}',
              f'visible_progress_messages={progress}',
              f'excluded_hidden_messages={a["excluded_hidden"]}',
              f'excluded_internal_assistant_messages={a["excluded_internal"]}',
              f'attachment_markers={attachment_markers}',
              f'semantic_sha256={a["semantic_sha"]}',
              f'transcript_bytes={len(transcript_bytes)}',
              f'transcript_lines={len(transcript.splitlines())}',
              f'transcript_words={len(transcript.split())}',
              f'transcript_sha256={sha(transcript_bytes)}',
              f'first_message_id={entries[0]["id"]}',
              f'first_message_role={entries[0]["role"]}',
              f'last_message_id={entries[-1]["id"]}',
              f'last_message_role={entries[-1]["role"]}',
              f'backend_current_node={current_node}',
              'double_fetch_stabilization=PASS',
              'real_end_verified=YES',
              'integral_export_validated=YES',
          ]
          DIAG.write_text('\n'.join(diag_lines) + '\n', encoding='utf-8')

          cmp_lines = [
              'DOUBLE_FETCH_STABILIZATION=PASS',
              'SEQUENCE_VISIBLE_IDENTIQUE=OUI',
              'PREMIER_MESSAGE_IDENTIQUE=OUI',
              'DERNIER_MESSAGE_IDENTIQUE=OUI',
              'EMPREINTE_SEMANTIQUE_IDENTIQUE=OUI',
              'FIN_REELLE_DU_PARTAGE_VERIFIEE=OUI',
              f'VISIBLE_ENTRIES={len(entries)}',
              f'SEMANTIC_SHA256={a["semantic_sha"]}',
              f'TRANSCRIPT_SHA256={sha(transcript_bytes)}',
          ]
          CMP.write_text('\n'.join(cmp_lines) + '\n', encoding='utf-8')
          PREVIEW.write_text(
              'FIRST\n' + json.dumps(entries[0], ensure_ascii=False, indent=2) +
              '\n\nLAST\n' + json.dumps(entries[-1], ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print('\n'.join(diag_lines))
          PY
          python /tmp/export_backend_share.py 2>&1 | tee tmp_chat_export_6a61d60a/result/run.log

      - name: Verify integrity and proven end
        shell: bash
        run: |
          set -euo pipefail
          DIR="tmp_chat_export_6a61d60a/result"
          DIAG="$DIR/diagnostics.txt"
          CMP="$DIR/double-fetch-comparison.txt"
          TXT="$DIR/conversation-chatgpt-public-6a99f33b-6bf8-83ea-80e3-ba4a0b6ce712-INTEGRALE.txt"
          test -s "$DIAG"
          test -s "$CMP"
          test -s "$TXT"
          grep -q '^share_url=https://chatgpt.com/share/6a99f33b-6bf8-83ea-80e3-ba4a0b6ce712$' "$DIAG"
          grep -q '^double_fetch_stabilization=PASS$' "$DIAG"
          grep -q '^real_end_verified=YES$' "$DIAG"
          grep -q '^integral_export_validated=YES$' "$DIAG"
          grep -q '^DOUBLE_FETCH_STABILIZATION=PASS$' "$CMP"
          grep -q '^FIN_REELLE_DU_PARTAGE_VERIFIEE=OUI$' "$CMP"
          python - <<'PY'
          from pathlib import Path
          diag = Path('tmp_chat_export_6a61d60a/result/diagnostics.txt').read_text(encoding='utf-8')
          values = {}
          for line in diag.splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  values[key.strip()] = value.strip()
          for name in ('visible_entries', 'visible_user_messages', 'visible_assistant_messages'):
              value = values.get(name, '')
              if not value.isdigit() or int(value) < 1:
                  raise SystemExit(f'Extraction incomplete: {name}={value!r}')
          print(diag)
          PY

      - name: Upload transcript and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-public-6a99f33b-integrale
          path: tmp_chat_export_6a61d60a/result/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
