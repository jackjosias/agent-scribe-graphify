name: Temporary stabilized ChatGPT transcript export 6a61d60a

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check curl-cffi beautifulsoup4

      - name: Extract and stabilize complete visible conversation
        env:
          SHARE_URL: https://chatgpt.com/share/6a61d60a-1844-83ea-928b-76ed2a2673ac
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp_chat_export_6a61d60a/result
          python tmp_chat_export_6a61d60a/export_stabilized.py 2>&1 | tee tmp_chat_export_6a61d60a/result/run.log

      - name: Verify integrity and proven end
        shell: bash
        run: |
          set -euo pipefail
          DIR="tmp_chat_export_6a61d60a/result"
          DIAG="$DIR/diagnostics.txt"
          CMP="$DIR/double-fetch-comparison.txt"
          TXT="$DIR/conversation-chatgpt-public-6a61d60a-1844-83ea-928b-76ed2a2673ac-INTEGRALE.txt"
          test -s "$DIAG"
          test -s "$CMP"
          test -s "$TXT"
          grep -q '^share_url=https://chatgpt.com/share/6a61d60a-1844-83ea-928b-76ed2a2673ac$' "$DIAG"
          grep -q '^double_fetch_stabilization=PASS$' "$DIAG"
          grep -q '^real_end_verified=YES$' "$DIAG"
          grep -q '^integral_export_validated=YES$' "$DIAG"
          grep -q '^DOUBLE_FETCH_STABILIZATION=PASS$' "$CMP"
          grep -q '^FIN_REELLE_DU_PARTAGE_VERIFIEE=OUI$' "$CMP"
          python - <<'PY'
          from pathlib import Path
          import re
          diag = Path('tmp_chat_export_6a61d60a/result/diagnostics.txt').read_text(encoding='utf-8')
          for name in ('visible_entries', 'visible_user_messages', 'visible_assistant_messages'):
              match = re.search(rf'^{name}=(\d+)$', diag, re.M)
              if not match or int(match.group(1)) < 1:
                  raise SystemExit(f'Extraction incomplete: {name}')
          print(diag)
          PY

      - name: Upload transcript and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-public-6a61d60a-integrale
          path: tmp_chat_export_6a61d60a/result/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
