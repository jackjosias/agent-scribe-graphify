name: Temporary exhaustive ChatGPT transcript export 6a5ea435

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check curl-cffi beautifulsoup4

      - name: Extract complete visible public conversation
        env:
          SHARE_URL: https://chatgpt.com/share/6a5ea435-a9a0-83ea-8c7a-b99d525f09dd
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp_chat_export_6a5ea435/result
          python tmp_chat_export_6a5ea435/export_public_share.py 2>&1 | tee tmp_chat_export_6a5ea435/result/run.log

      - name: Verify transcript integrity
        shell: bash
        run: |
          set -euo pipefail
          DIAG="tmp_chat_export_6a5ea435/result/diagnostics.txt"
          TXT="tmp_chat_export_6a5ea435/result/conversation-chatgpt-public-6a5ea435-a9a0-83ea-8c7a-b99d525f09dd-INTEGRALE.txt"
          test -s "$DIAG"
          test -s "$TXT"
          grep -q '^share_url=https://chatgpt.com/share/6a5ea435-a9a0-83ea-8c7a-b99d525f09dd$' "$DIAG"
          python - <<'PY'
          from pathlib import Path
          import re
          diag = Path('tmp_chat_export_6a5ea435/result/diagnostics.txt').read_text(encoding='utf-8')
          visible = re.search(r'^visible_entries=(\d+)$', diag, re.M)
          users = re.search(r'^visible_user_messages=(\d+)$', diag, re.M)
          assistants = re.search(r'^visible_assistant_messages=(\d+)$', diag, re.M)
          if not visible or int(visible.group(1)) < 2:
              raise SystemExit('Extraction incomplete: visible_entries < 2')
          if not users or int(users.group(1)) < 1:
              raise SystemExit('Extraction incomplete: no visible user message')
          if not assistants or int(assistants.group(1)) < 1:
              raise SystemExit('Extraction incomplete: no visible assistant message')
          print(diag)
          PY

      - name: Upload exact transcript and verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-public-6a5ea435-integrale
          path: tmp_chat_export_6a5ea435/result/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
