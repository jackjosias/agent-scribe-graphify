name: Temporary public ChatGPT DOM export

on:
  push:
    branches:
      - tmp/chat-export-6a55289f-20260713

permissions:
  contents: write

jobs:
  export-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/chat-export-6a55289f-20260713

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Extract messages from downloaded public HTML
        run: python tmp_tools/dom_extract.py

      - name: Commit DOM extraction result
        run: |
          git config user.name "chat-export-bot"
          git config user.email "chat-export-bot@users.noreply.github.com"
          git add tmp_export_dom
          git commit -m "chore(tmp): store DOM conversation export result" || true
          git push origin HEAD:tmp/chat-export-6a55289f-20260713
