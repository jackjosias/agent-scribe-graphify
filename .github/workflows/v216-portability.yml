name: V2.16 TENOR portability

on:
  pull_request:
    paths:
      - ".agent/**"
      - ".github/workflows/v216-portability.yml"
  push:
    branches:
      - "agent/v2-16-tenor-init-single-authority"
      - "v2"
    paths:
      - ".agent/**"
      - ".github/workflows/v216-portability.yml"

permissions:
  contents: read

concurrency:
  group: v216-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate machine protocol JSON
        run: python -m json.tool .agent/rules/tenor-init-v2.json

      - name: Compile V2.16 core
        run: >-
          python -m py_compile
          .agent/mcp/runtime/installation_state.py
          .agent/mcp/runtime/tenor_init_orchestrator.py
          .agent/mcp/runtime/graphify_readiness.py
          .agent/mcp/runtime/graphify_guard.py
          .agent/mcp/runtime/graphify_scribe_bridge.py
          .agent/mcp/server_entry.py
          .agent/host_adapter/policy.py
          .agent/host_adapter/launcher.py
          .agent/host_adapter/instructions.py
          .agent/host_adapter/templates.py
          .agent/workflow/scribe/sel/scripts/scribe_bootstrap.py
          .agent/workflow/scribe/sel/scripts/scribe_tenor_init_v216.py
          .agent/workflow/scribe/sel/scripts/scribe_bundle_graph.py

      - name: Run portable core tests with structured logs
        shell: python
        env:
          V216_LOG_DIR: ${{ runner.temp }}/v216-core-${{ matrix.os }}-py${{ matrix.python }}
        run: |
          import json
          import os
          import subprocess
          import sys
          import traceback
          from pathlib import Path

          for stream in (sys.stdout, sys.stderr):
              reconfigure = getattr(stream, "reconfigure", None)
              if callable(reconfigure):
                  reconfigure(encoding="utf-8", errors="backslashreplace")

          tests = [
              ("cross_platform", ".agent/mcp/tests/test_v216_cross_platform.py"),
              ("tenor_init_orchestrator", ".agent/mcp/tests/test_tenor_init_orchestrator.py"),
              ("installation_output_preservation", ".agent/mcp/tests/test_installation_output_preservation.py"),
              ("graphify_readiness", ".agent/mcp/tests/test_graphify_readiness.py"),
              ("scribe_bootstrap", ".agent/workflow/scribe/sel/tests/test_scribe_bootstrap.py"),
              ("host_adapter", ".agent/mcp/tests/test_host_adapter_autoguard.py"),
          ]
          output_dir = Path(os.environ["V216_LOG_DIR"])
          output_dir.mkdir(parents=True, exist_ok=True)
          results_path = output_dir / "results.json"
          results = []

          def as_text(value):
              if isinstance(value, bytes):
                  return value.decode("utf-8", errors="replace")
              return value if isinstance(value, str) else ""

          def persist_results():
              results_path.write_text(
                  json.dumps(results, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          persist_results()

          for label, script in tests:
              try:
                  completed = subprocess.run(
                      [sys.executable, script],
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                      capture_output=True,
                      timeout=300,
                      check=False,
                  )
                  stdout = completed.stdout
                  stderr = completed.stderr
                  returncode = completed.returncode
              except subprocess.TimeoutExpired as exc:
                  stdout = as_text(exc.stdout)
                  stderr = as_text(exc.stderr) + "\nTEST_TIMEOUT_300S\n"
                  returncode = 124
              except BaseException:
                  stdout = ""
                  stderr = "HARNESS_EXCEPTION\n" + traceback.format_exc()
                  returncode = 125

              combined = f"STDOUT\n{stdout}\nSTDERR\n{stderr}"
              (output_dir / f"{label}.log").write_text(combined, encoding="utf-8")
              results.append({"label": label, "script": script, "returncode": returncode})
              persist_results()
              print(f"PORTABLE_TEST {label} rc={returncode}", flush=True)
              if returncode != 0:
                  lines = combined.splitlines()
                  print("\n".join(lines[-80:]), file=sys.stderr, flush=True)

      - name: Upload portable test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v216-core-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/v216-core-${{ matrix.os }}-py${{ matrix.python }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce portable test results
        if: always()
        shell: python
        env:
          V216_LOG_DIR: ${{ runner.temp }}/v216-core-${{ matrix.os }}-py${{ matrix.python }}
        run: |
          import json
          import os
          from pathlib import Path

          results_path = Path(os.environ["V216_LOG_DIR"]) / "results.json"
          if not results_path.is_file():
              raise SystemExit("PORTABLE_RESULTS_MISSING")
          results = json.loads(results_path.read_text(encoding="utf-8"))
          failures = [result for result in results if result["returncode"] != 0]
          if failures:
              raise SystemExit(f"PORTABLE_TEST_FAILURES: {failures}")
          print("PORTABLE_CORE_ALL_OK")

  linux-deep-validation:
    name: Linux deep validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: portable-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Run sequential validation suite with hard timeout
        shell: python
        env:
          V216_LOG_DIR: ${{ runner.temp }}/v216-linux-deep-validation
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          output_dir = Path(os.environ["V216_LOG_DIR"])
          output_dir.mkdir(parents=True, exist_ok=True)
          try:
              completed = subprocess.run(
                  [sys.executable, ".agent/scripts/validation_suite.py"],
                  text=True,
                  encoding="utf-8",
                  errors="replace",
                  capture_output=True,
                  timeout=600,
                  check=False,
              )
              stdout = completed.stdout
              stderr = completed.stderr
              returncode = completed.returncode
          except subprocess.TimeoutExpired as exc:
              stdout = exc.stdout.decode("utf-8", errors="replace") if isinstance(exc.stdout, bytes) else (exc.stdout or "")
              stderr = exc.stderr.decode("utf-8", errors="replace") if isinstance(exc.stderr, bytes) else (exc.stderr or "")
              stderr += "\nVALIDATION_SUITE_TIMEOUT_600S\n"
              returncode = 124
          combined = f"STDOUT\n{stdout}\nSTDERR\n{stderr}"
          (output_dir / "deep-validation.log").write_text(combined, encoding="utf-8")
          print("\n".join(combined.splitlines()[-120:]), flush=True)
          (output_dir / "deep-validation-exit.txt").write_text(f"{returncode}\n", encoding="utf-8")

      - name: Upload deep validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v216-linux-deep-validation
          path: ${{ runner.temp }}/v216-linux-deep-validation
          if-no-files-found: error
          retention-days: 14

      - name: Enforce deep validation result
        shell: python
        env:
          V216_LOG_DIR: ${{ runner.temp }}/v216-linux-deep-validation
        run: |
          import os
          from pathlib import Path

          returncode = int(
              (Path(os.environ["V216_LOG_DIR"]) / "deep-validation-exit.txt")
              .read_text(encoding="utf-8")
              .strip()
          )
          if returncode != 0:
              raise SystemExit(f"VALIDATION_SUITE_FAILED rc={returncode}")
          print("VALIDATION_SUITE_OK")

      - name: Verify clean generated-artifact hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain=v1)" || {
            echo "Validation left the checkout dirty:" >&2
            git status --short >&2
            exit 1
          }
