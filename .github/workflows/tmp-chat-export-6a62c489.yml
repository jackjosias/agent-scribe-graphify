name: Temporary stabilized ChatGPT transcript export 6a62c489

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check curl-cffi beautifulsoup4

      - name: Extract the complete visible conversation twice
        env:
          SHARE_URL: https://chatgpt.com/share/6a62c489-e04c-83ea-89b1-ae74ca7a4cea
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp_chat_export_6a62c489/result
          python tmp_chat_export_6a62c489/export_stabilized.py 2>&1 | tee tmp_chat_export_6a62c489/result/run.log

      - name: Verify completeness and proven end
        shell: bash
        run: |
          set -euo pipefail
          DIR='tmp_chat_export_6a62c489/result'
          DIAG="$DIR/diagnostics.txt"
          CMP="$DIR/double-fetch-comparison.txt"
          TXT="$DIR/conversation-chatgpt-public-6a62c489-e04c-83ea-89b1-ae74ca7a4cea-INTEGRALE.txt"
          test -s "$DIAG"
          test -s "$CMP"
          test -s "$TXT"
          grep -q '^share_url=https://chatgpt.com/share/6a62c489-e04c-83ea-89b1-ae74ca7a4cea$' "$DIAG"
          grep -q '^double_fetch_stabilization=PASS$' "$DIAG"
          grep -q '^real_end_verified=YES$' "$DIAG"
          grep -q '^integral_export_validated=YES$' "$DIAG"
          grep -q '^DOUBLE_FETCH_STABILIZATION=PASS$' "$CMP"
          grep -q '^FIN_REELLE_DU_PARTAGE_VERIFIEE=OUI$' "$CMP"

      - name: Upload TXT and verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-public-6a62c489-integrale
          path: tmp_chat_export_6a62c489/result/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
